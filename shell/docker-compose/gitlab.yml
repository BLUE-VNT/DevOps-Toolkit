services:
  gitlab19:
    image: 'gitlab/gitlab-ee:19.3.2-ee.0'
    container_name: gitlab19
    hostname: 'gitlab.bluedata.asia'
    restart: unless-stopped
    privileged: true
    user: root
    network_mode: host
    shm_size: '256m'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      TZ: Asia/Ho_Chi_Minh
      GITLAB_LOG_LEVEL: info
      GITLAB_SKIP_UNMIGRATED_DATA_CHECK: true
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.bluedata.asia'
        gitlab_rails['gitlab_ssh_host'] = 'gitlab.bluedata.asia'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['time_zone'] = 'Asia/Ho_Chi_Minh'
        gitlab_rails['databases']['ci']['enable'] = false
        gitlab_rails['log_directory'] = "/var/log/gitlab/gitlab-rails"
        letsencrypt['enable'] = false

        # ============================================================
        # NGINX (GitLab 19.2+: rails settings under gitlab_rails['nginx'])
        # ============================================================
        nginx['enable'] = true
        nginx['gzip_enabled'] = true
        nginx['status'] = {
          "listen_addresses" => ["127.0.0.1"],
          "port" => 8889,
          "options" => {
            "server_tokens" => "off",
            "access_log" => "off",
            "allow" => "127.0.0.1",
            "deny" => "all"
          }
        }
        gitlab_rails['nginx']['listen_port'] = 8888
        gitlab_rails['nginx']['listen_https'] = false
        gitlab_rails['nginx']['redirect_http_to_https'] = false
        gitlab_rails['nginx']['client_max_body_size'] = '200m'
        gitlab_rails['nginx']['error_log_level'] = "error"
        gitlab_rails['nginx']['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on",
          "X-GitLab-Show-Login-Captcha" => "1"
        }
        gitlab_rails['nginx']['custom_error_pages'] = {
          '404' => {
            'title' => 'Not found',
            'header' => 'Not found',
            'message' => '404 not found'
          },
          '403' => {
            'title' => 'Forbidden',
            'header' => 'Forbidden',
            'message' => '403 forbidden'
          },
        }

        # ============================================================
        # External Redis (bundled disabled)
        # ============================================================
        redis['enable'] = false
        gitlab_rails['redis_host'] = '127.0.0.1'
        gitlab_rails['redis_port'] = 6379

        # ============================================================
        # External PostgreSQL (bundled disabled)
        # ============================================================
        postgresql['enable'] = false
        postgresql['ssl'] = 'off'
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'utf8'
        gitlab_rails['db_host'] = '127.0.0.1'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_username'] = 'gitlabhq'
        gitlab_rails['db_password'] = 'JFPAudioHJHuqow6DuNtYxDUJNKYY'
        gitlab_rails['db_connect_timeout'] = 8

        # ============================================================
        # Puma / Workhorse / Sidekiq / Gitaly / KAS
        # ============================================================
        puma['enable'] = true
        puma['listen'] = '127.0.0.1'
        puma['port'] = 8890
        puma['worker_processes'] = 2
        puma['exporter_enabled'] = true
        puma['exporter_address'] = "127.0.0.1"
        puma['exporter_port'] = 8093
        gitlab_workhorse['enable'] = true
        gitlab_workhorse['prometheus_listen_addr'] = "127.0.0.1:9229"
        sidekiq['enable'] = true
        sidekiq['listen_address'] = '127.0.0.1'
        sidekiq['listen_port'] = 8091
        sidekiq['exporter_log_enabled'] = false
        sidekiq['metrics_enabled'] = true
        gitaly['enable'] = true
        gitlab_kas['enable'] = true

        # ============================================================
        # Registry / Pages (disabled)
        # ============================================================
        registry['enable'] = false
        registry['log_level'] = 'warn'
        gitlab_pages['enable'] = false

        # ============================================================
        # Features
        # ============================================================
        gitlab_rails['packages_enabled'] = true
        gitlab_rails['artifacts_enabled'] = true
        gitlab_rails['lfs_enabled'] = true
        gitlab_rails['gitlab_default_projects_features_container_registry'] = false
        gitlab_rails['gitlab_default_projects_features_builds'] = true

        # ============================================================
        # Monitoring
        # Do NOT set grafana[*] or mattermost[*] — removed from Omnibus
        # ============================================================
        prometheus['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = true
        node_exporter['listen_address'] = '127.0.0.1:8099'
        gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '127.0.0.1']
        gitlab_rails['prometheus_address'] = '127.0.0.1:9090'
        gitlab_exporter['enable'] = true
        gitlab_exporter['listen_address'] = '127.0.0.1'
        gitlab_exporter['listen_port'] = '9168'
        postgres_exporter['enable'] = false
        redis_exporter['enable'] = false

        # ============================================================
        # SMTP
        # ============================================================
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "smtp.gmail.com"
        gitlab_rails['smtp_port'] = 587
        gitlab_rails['smtp_user_name'] = "gitlab@bluedata.asia"
        gitlab_rails['smtp_password'] = "rfiikvxkkspakjwsbkh"
        gitlab_rails['smtp_domain'] = "smtp.gmail.com"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'peer'

        # ============================================================
        # Backup (local + GCS upload)
        # ============================================================
        gitlab_rails['backup_path'] = "/gitlab-backup"
        gitlab_rails['backup_keep_time'] = 604800
        gitlab_rails['backup_upload_connection'] = {
          'provider' => 'Google',
          'google_storage_access_key_id' => 'NULL',
          'google_storage_secret_access_key' => 'NULL',
        }
        gitlab_rails['backup_upload_remote_directory'] = 'gitlab-backup'

        # ============================================================
        # OmniAuth
        # ============================================================
        gitlab_rails['omniauth_providers'] = [
          {
            "name" => "google_oauth2",
            "app_id" => "NULLm",
            "app_secret" => "NULL",
            "args" => { "access_type" => "offline", "approval_prompt" => '' }
          }
        ]

        # ============================================================
        # Logging
        # ============================================================
        logging['logrotate_frequency'] = "daily"
        logging['logrotate_rotate'] = 30
        logging['logrotate_size'] = "100M"
        gitlab_shell['log_level'] = 'WARN'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8888/-/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    volumes:
      - './gitlab-data/config:/etc/gitlab'
      - './gitlab-data/logs:/var/log/gitlab:rw'
      - './gitlab-data/data:/var/opt/gitlab'
      - './sshd_config:/assets/sshd_config'
      - './gitlab-backup:/gitlab-backup'