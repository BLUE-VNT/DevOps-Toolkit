# Redis 7.2 for GitLab 19.x (external, network_mode: host on Linux)
# Bind localhost only — GitLab connects via 127.0.0.1

bind 127.0.0.1
port 6379
protected-mode yes

daemonize no
supervised no
pidfile /data/redis-gitlab.pid

dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# GitLab: prefer noeviction so Sidekiq jobs are not dropped under memory pressure.
maxmemory 1gb
maxmemory-policy noeviction

tcp-backlog 511
timeout 0
tcp-keepalive 300

databases 16
save 900 1
save 300 10
save 60 10000

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

loglevel notice
logfile ""

slowlog-log-slower-than 10000
slowlog-max-len 128